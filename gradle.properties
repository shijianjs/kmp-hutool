kotlin.js.yarn=false

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# This repository's own version: {the upstream Hutool release this port follows}-kt.{revision}.
# It is not the version of any dependency, so it stays here rather than in the catalog, and only
# the release workflow changes it.
kmp-hutool.version=5.8.48-kt.1

# Dependency and plugin versions, by contrast, live in `gradle/libs.versions.toml` and are read
# through the generated `libs` accessor. That includes the ktjs sibling coordinates and the
# ktjs-docusaurus triple (plugin, wrapper klib, kit); a `-SNAPSHOT` one resolves from `mavenLocal`,
# where every working tree publishes it with `./gradlew publishToMavenLocal`.
