kotlin.js.yarn=false

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# Versioning: {the upstream Hutool release this port follows}-kt.{revision}. The working tree appends
# `-SNAPSHOT` (see build.gradle.kts); `-Pkmp-hutool.release=true` drops it.
kmp-hutool.version=5.8.48-kt.1

# The ktjs-docusaurus versions the docs site is built with: the Gradle plugin (settings.gradle.kts)
# and the wrapper klib (docs/build.gradle.kts). Both come from that project, but each of its modules
# carries its own `-kt.N` revision, so the numbers are independent and both are needed.
#
# `mavenLocal` in settings.gradle.kts resolves a SNAPSHOT here: a working tree of ktjs-docusaurus
# publishes one with `./gradlew publishToMavenLocal` (root build for the klibs) and the same task in
# `ktjs-docusaurus-gradle-plugin/`. Released versions come from Maven Central and need neither.
ktjs-docusaurus.version=3.10.2-kt.2-SNAPSHOT
ktjs-docusaurus-gradle-plugin.version=3.10.2-kt.1-SNAPSHOT
