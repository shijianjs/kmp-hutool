name: CI

on:
  # Pull requests only: a commit that reached the default branch was already verified by the PR run,
  # so a push would just spend the same build again. Run this manually when needed
  # (`gh workflow run ci.yml`); release pipelines keep their tag trigger.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The primary job: JVM, JS, Wasm and the host-native suite on Linux, plus the documentation site,
  # the demo bundle and the Dokka reference that the Pages workflow deploys.
  build:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # A Dependabot PR does not carry the Gradle-generated lock files, so refresh them before
      # building. The JS store and the Wasm store are separate ones and `build` verifies each of
      # them, so a dependency that reaches both must refresh both.
      - name: Refresh npm lock files
        if: github.actor == 'dependabot[bot]'
        run: ./gradlew kotlinUpgradePackageLock kotlinWasmUpgradePackageLock

      # `build` compiles every target (JVM, JS, Wasm, all Kotlin/Native klibs) and runs the tests this
      # host can execute: JVM, Node.js and linuxX64. Non-host native tests are disabled in the build
      # script, so this never trips over a test binary it cannot link.
      - name: Build and test
        run: ./gradlew build --stacktrace

      # Assembles the documentation site, the demo and Dokka under build/pages. Runs here so a broken
      # docs link fails CI instead of only failing the deploy workflow.
      - name: Assemble Pages site
        run: ./gradlew pagesSite

      # Both stores travel in one artifact: it is extracted into `kotlin-js-store` again, where
      # `package-lock.json` and `wasm/package-lock.json` are the paths the checkout tracks.
      - name: Upload refreshed npm lock files
        if: github.actor == 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: npm-lock
          path: |
            kotlin-js-store/package-lock.json
            kotlin-js-store/wasm/package-lock.json

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # Kotlin/Native can only run a test executable on its own host family, which is why the build
  # declares every target but disables the foreign test tasks. These two jobs cover the remaining
  # hosts: Windows proves mingwX64, macOS proves the Apple targets.
  native-tests:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # A Dependabot PR carries no lock files, and the npm workspaces are configured during
      # configuration, so refresh both stores before the native build; a stale one fails the
      # build even though this job never compiles the target that owns it.
      - name: Refresh npm lock files
        if: github.actor == 'dependabot[bot]'
        run: ./gradlew kotlinUpgradePackageLock kotlinWasmUpgradePackageLock

      # Runs every test this host can execute. The build script enables only the host's own native
      # suite, so Windows covers mingwX64 and macOS covers its arch's macOS/iOS-simulator tests.
      - name: Run tests
        run: ./gradlew :kmp-hutool-core:allTests --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
