name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A Dependabot PR does not carry the Gradle-generated lock file, so refresh it before building.
      - name: Refresh npm lock file
        if: github.actor == 'dependabot[bot]'
        run: ./gradlew kotlinUpgradePackageLock

      # `build` compiles and tests every target of kmp-hutool-core (JVM and Node.js) plus the docs
      # configuration and the demo bundle.
      - name: Build and test
        run: ./gradlew build --stacktrace

      # Validates the demo bundle, the documentation site and the Dokka reference that the Pages
      # workflow deploys.
      - name: Assemble Pages site
        run: ./gradlew pagesSite

      - name: Upload refreshed npm lock file
        if: github.actor == 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: npm-lock
          path: kotlin-js-store/package-lock.json

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
